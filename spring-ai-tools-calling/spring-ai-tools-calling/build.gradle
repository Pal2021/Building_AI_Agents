plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'        // ✅ Stable + compatible
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.springaitools'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()                                        // ✅ Spring AI 1.x is fully GA on Maven Central
}

dependencyManagement {
	imports {
		// 💡 Upgraded to 1.1.6 for critical security patches & better auto-config stability
		mavenBom "org.springframework.ai:spring-ai-bom:1.1.6"
	}
}

dependencies {
	// 💡 Changed to web starter if you plan to build APIs/Rest endpoints for your LLM interactions
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// ✅ The official starter for Google GenAI (Gemini)
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// MCP Client dependency — this is the key new addition
	implementation 'org.springframework.ai:spring-ai-mcp-client-spring-boot-starter'
	// 2. The Spring Boot starter for auto-configuration properties
	implementation 'org.springframework.ai:spring-ai-mcp-client-spring-boot-starter'

}

tasks.named('test') {
	useJUnitPlatform()
}